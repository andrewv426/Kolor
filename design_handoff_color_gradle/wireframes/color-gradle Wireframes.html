<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>color-gradle — Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet" />
<style>
/* ============================ TOKENS / VIBES ============================ */
:root{
  --bg:#E8E6DF;          /* desk surface behind everything */
  --panel:#F4F3EF;       /* explorer chrome */
}
.explorer{
  /* Playful (default) */
  --paper:#F4F3EF; --ink:#222019; --ink2:#7C776C; --line:#D7D3CA;
  --stroke:#34302A; --screen:#FFFFFF; --hatch:#EAE7E0; --hatch2:#DFDBD2;
  --accent:#5C7CC2; --accent-soft:#DEE6F4;
  --radius:14px; --radius-sm:9px; --ui:'Nunito',system-ui,sans-serif; --disp:'Nunito',sans-serif;
}
.explorer.vibe-crafted{
  --paper:#ECEAE4; --ink:#1C1A16; --ink2:#867F73; --line:#D0CCC3;
  --stroke:#2A2620; --screen:#FBF9F5; --hatch:#E4E0D8; --hatch2:#D9D4CA;
  --accent:#A56A4C; --accent-soft:#EBDED4;
  --radius:3px; --radius-sm:2px; --ui:'Archivo',system-ui,sans-serif; --disp:'Newsreader',serif;
}

*{box-sizing:border-box;}
html,body{margin:0;}
body{background:var(--bg);}
.explorer{
  min-height:100vh; background:var(--paper); color:var(--ink);
  font-family:var(--ui); -webkit-font-smoothing:antialiased;
  padding-bottom:80px;
}

/* ============================ TOP BAR ============================ */
.topbar{
  position:sticky; top:0; z-index:30; background:var(--paper);
  border-bottom:1.5px solid var(--line);
  display:flex; align-items:center; gap:22px; flex-wrap:wrap;
  padding:14px 26px;
}
.brand{display:flex; align-items:baseline; gap:11px;}
.brand .dot{
  width:13px;height:13px;border-radius:50%;
  background:linear-gradient(135deg,#7da0e0,#c98b6b 70%); display:inline-block;
}
.brand h1{font-size:17px; margin:0; letter-spacing:-.01em; font-weight:800;}
.vibe-crafted .brand h1{font-weight:600;}
.brand .sub{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink2); letter-spacing:.04em;}
.spacer{flex:1;}
.ctrl{display:flex; align-items:center; gap:9px;}
.ctrl > .cap{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--ink2); text-transform:uppercase; letter-spacing:.08em;}
.seg{display:inline-flex; border:1.5px solid var(--stroke); border-radius:999px; overflow:hidden; background:var(--screen);}
.seg button{
  appearance:none; border:0; background:transparent; cursor:pointer;
  font-family:var(--ui); font-size:12.5px; font-weight:600; color:var(--ink2);
  padding:6px 14px; line-height:1;
}
.seg button + button{border-left:1.5px solid var(--line);}
.seg button.on{background:var(--ink); color:var(--paper);}

/* ============================ SCREEN TABS ============================ */
.tabs{
  position:sticky; top:55px; z-index:20; background:var(--paper);
  display:flex; gap:6px; flex-wrap:wrap; padding:11px 26px 12px;
  border-bottom:1.5px solid var(--line);
}
.tab{
  appearance:none; cursor:pointer; background:transparent;
  border:1.5px solid var(--line); color:var(--ink2);
  font-family:var(--ui); font-weight:600; font-size:12.5px;
  padding:6px 13px; border-radius:999px; display:flex; align-items:center; gap:7px;
}
.tab .n{font-family:'JetBrains Mono',monospace; font-size:10px; opacity:.6;}
.tab.on{border-color:var(--stroke); color:var(--ink); background:var(--screen); box-shadow:0 1px 0 var(--line);}

/* ============================ SCREEN HEADER ============================ */
.screenhead{padding:22px 26px 4px; max-width:920px;}
.screenhead .k{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent);}
.screenhead h2{font-family:var(--disp); font-size:25px; margin:6px 0 7px; letter-spacing:-.01em; font-weight:700;}
.screenhead p{margin:0; font-size:14px; line-height:1.55; color:var(--ink2); max-width:680px;}

/* ============================ CANVAS / COLUMNS ============================ */
.canvas{
  display:flex; flex-wrap:wrap; gap:30px 26px; align-items:flex-start;
  padding:26px; justify-content:center;
}
.canvas.desk-mode{flex-direction:column; align-items:center;}
.col{display:flex; flex-direction:column; gap:13px; align-items:center;}
.annot{font-family:'JetBrains Mono',monospace; text-align:center; max-width:320px;}
.annot .id{font-size:12px; font-weight:700; color:var(--ink); letter-spacing:.02em;}
.annot .sub{font-size:11px; color:var(--ink2); margin-top:3px; line-height:1.5;}
.desk .annot, .col.deskcol .annot{max-width:none;}

/* ============================ PHONE FRAME ============================ */
.phone{
  width:300px; height:642px; background:var(--screen);
  border:2px solid var(--stroke); border-radius:34px; padding:9px;
  box-shadow:0 14px 30px -18px rgba(40,35,25,.45);
  position:relative; flex:0 0 auto;
}
.phone-screen{
  width:100%; height:100%; border-radius:26px; overflow:hidden;
  position:relative; display:flex; flex-direction:column; background:var(--screen);
}
.phone .notch{
  position:absolute; top:15px; left:50%; transform:translateX(-50%);
  width:78px; height:6px; border-radius:99px; background:var(--line); z-index:5;
}

/* ============================ DESKTOP FRAME ============================ */
.desk{width:min(940px,94vw); flex:0 0 auto;}
.desk-win{
  background:var(--screen); border:2px solid var(--stroke); border-radius:12px;
  overflow:hidden; box-shadow:0 16px 36px -20px rgba(40,35,25,.4);
}
.desk-bar{
  height:34px; border-bottom:1.5px solid var(--line); display:flex; align-items:center;
  gap:7px; padding:0 13px; background:var(--paper);
}
.desk-bar .tl{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--stroke);}
.desk-bar .url{
  margin-left:10px; flex:1; max-width:360px; height:17px; border-radius:99px;
  border:1.5px solid var(--line); background:var(--screen);
  font-family:'JetBrains Mono',monospace; font-size:9.5px; color:var(--ink2);
  display:flex; align-items:center; padding:0 10px;
}
.desk-screen{position:relative; background:var(--screen); height:560px; overflow:hidden; display:flex; flex-direction:column;}

/* ============================ WIREFRAME PRIMITIVES ============================ */
.ph{
  position:relative; background:
    repeating-linear-gradient(135deg,var(--hatch) 0 7px,var(--hatch2) 7px 14px);
  display:flex; align-items:center; justify-content:center;
  color:var(--ink2); overflow:hidden;
}
.ph::after{
  content:""; position:absolute; inset:0; border:1.5px dashed var(--line); pointer-events:none;
}
.ph .ph-l{
  font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.06em;
  text-transform:uppercase; background:var(--screen); color:var(--ink2);
  padding:3px 8px; border-radius:99px; border:1.5px solid var(--line);
}
.cap-row{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}

/* slider */
.slider{display:flex; flex-direction:column; gap:5px; width:100%;}
.slider .s-top{display:flex; justify-content:space-between; align-items:baseline;}
.slider .s-label{font-size:12px; font-weight:600; color:var(--ink);}
.slider .s-val{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--ink2);}
.s-track{position:relative; height:4px; border-radius:99px; background:var(--line);}
.s-track .s-fill{position:absolute; left:50%; top:0; bottom:0; background:var(--accent); opacity:.5; border-radius:99px;}
.s-knob{
  position:absolute; top:50%; width:16px; height:16px; border-radius:50%;
  background:var(--screen); border:2px solid var(--stroke); transform:translate(-50%,-50%);
}
.slider.mini .s-knob{width:12px;height:12px;}
.slider.mini .s-label{font-size:11px;font-weight:500;}

/* chips / tools */
.chip{
  font-family:var(--ui); font-size:11.5px; font-weight:600; color:var(--ink2);
  border:1.5px solid var(--line); border-radius:99px; padding:6px 11px; white-space:nowrap; background:var(--screen);
}
.chip.on{border-color:var(--stroke); color:var(--ink); background:var(--accent-soft);}

/* buttons */
.btn{
  font-family:var(--ui); font-weight:700; font-size:13.5px; cursor:default;
  border:1.5px solid var(--stroke); border-radius:var(--radius-sm);
  padding:11px 16px; color:var(--ink); background:var(--screen); text-align:center;
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
}
.vibe-crafted .btn{font-weight:600;}
.btn.primary{background:var(--ink); color:var(--paper); border-color:var(--ink);}
.btn.accent{background:var(--accent); color:#fff; border-color:var(--accent);}
.btn.block{width:100%;}
.btn.lg{padding:14px 18px; font-size:15px;}
.btn.ghost{background:transparent;}

/* badges + meta */
.badge{
  font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:700; letter-spacing:.06em;
  border:1.5px solid var(--stroke); border-radius:6px; padding:3px 7px; color:var(--ink); background:var(--screen);
}
.badge.fill{background:var(--ink); color:var(--paper);}
.badge.ai{border-style:dashed; color:var(--accent); border-color:var(--accent);}
.pill{
  font-family:var(--ui); font-size:11px; font-weight:600; color:var(--ink2);
  border:1.5px solid var(--line); border-radius:99px; padding:4px 10px; display:inline-flex; align-items:center; gap:6px;
}
.timer{
  font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px; color:var(--ink);
  border:1.5px solid var(--stroke); border-radius:8px; padding:5px 9px; background:var(--screen);
}
.dotlive{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;}

/* text skeleton bars */
.bar{height:8px; border-radius:99px; background:var(--line);}
.bar.d{background:var(--hatch2);}
.bars{display:flex; flex-direction:column; gap:7px;}

/* sort tabs */
.sorttabs{display:flex; gap:5px;}
.sorttab{font-family:var(--ui); font-size:12px; font-weight:600; color:var(--ink2); padding:5px 11px; border-radius:99px; border:1.5px solid transparent;}
.sorttab.on{color:var(--ink); border-color:var(--line); background:var(--screen);}

/* grid */
.wgrid{display:grid; gap:8px;}
.tile{position:relative; border:1.5px solid var(--line); border-radius:var(--radius-sm); overflow:hidden; background:var(--screen);}
.tile .meta{display:flex; align-items:center; justify-content:space-between; padding:6px 8px;}
.tile .av{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--stroke);display:inline-block;}
.heart{font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--ink2); display:flex; align-items:center; gap:4px;}
.tag-you{position:absolute; top:6px; left:6px;}

/* swatches */
.swatches{display:flex; gap:5px;}
.swatch{width:22px;height:22px;border-radius:5px;border:1.5px solid var(--line);}

/* generic helpers */
.row{display:flex; align-items:center; gap:9px;}
.col-stk{display:flex; flex-direction:column;}
.between{justify-content:space-between;}
.center{justify-content:center; align-items:center;}
.muted{color:var(--ink2);}
.mono{font-family:'JetBrains Mono',monospace;}
.divline{height:1.5px; background:var(--line); width:100%;}
.scrim{position:absolute; inset:0; background:linear-gradient(to top,rgba(20,18,14,.5),transparent 42%);}
.note{
  display:inline-flex; gap:6px; align-items:center;
  font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--ink2);
  border:1.5px dashed var(--line); border-radius:6px; padding:4px 8px; background:var(--screen);
}

/* legend footer */
.legend{
  position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:40;
  display:flex; gap:16px; align-items:center; background:var(--screen);
  border:1.5px solid var(--stroke); border-radius:99px; padding:8px 16px;
  font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--ink2);
  box-shadow:0 10px 24px -14px rgba(40,35,25,.5);
}
.legend b{color:var(--ink); font-weight:700;}

/* hide scrollbars inside frames but keep scroll */
.noscroll::-webkit-scrollbar{display:none;}
.noscroll{scrollbar-width:none;}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
